[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audience_vectors"
version = "0.0.1"
description = "Interpretable viewer-response directions in brain-aligned video models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Jawaun Brown" }]
dependencies = [
    "pydantic[email]==2.12.5",
    "python-dotenv==1.1.0",
    "httpx==0.28.1",
    "anthropic==0.80.0",
    "google-genai==1.56.0",
    "logfire==4.16.0",
    "numpy>=1.26,<3.0",
    "pyarrow==23.0.1",
    "polars>=1.20,<2.0",
    "duckdb>=1.4,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "typer>=0.15,<1.0",
    "rich>=14.0,<15.0",
    "tqdm>=4.67,<5.0",
    "huggingface-hub>=0.36,<1.0",
    "pillow==12.1.0",
    "umap-learn>=0.5.12",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.5.0",
    "nilearn>=0.13.1",
    "nibabel>=5.4.2",
]

[project.optional-dependencies]
# Pulled in only when you push GPU jobs to Modal.
modal = [
    "modal==1.1.4",
]

# Heavy ML stack — install on machines that run feature extraction locally.
# Modal containers install their own pinned versions in image_factory.py.
ml = [
    "torch>=2.5,<2.7",
    "torchvision",
    "torchaudio",
    "transformers>=4.46,<5.0",
    "safetensors>=0.4,<1.0",
    "einops>=0.8,<1.0",
    "opencv-python-headless>=4.10,<5.0",
    "librosa>=0.10,<1.0",
    "decord>=0.6,<1.0",
    "ffmpeg-python>=0.2,<1.0",
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<3.0",
    "zarr>=2.18,<3.0",
]

# Experiment tracking — optional.
tracking = [
    "wandb>=0.18,<1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==1.2.0",
    "pyright==1.1.404",
    "ruff==0.8.2",
    "ipykernel>=6.29,<7.0",
    "jupyterlab>=4.3,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audience_vectors"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "PLW0603", "BLE001", "C901", "PLR0912", "PLR0915"]
ignore = ["E402", "E501", "UP007", "UP017", "UP035", "UP038"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 100

[tool.ruff.lint.isort]
known-first-party = ["audience_vectors"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.12"
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
